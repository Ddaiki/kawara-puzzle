<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>瓦葺きパズル 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 画面いっぱいの3D屋根。上に得点帯と雨雲・バケツ、下に操作ボタン。空と屋根の一枚絵として単一テーマで固定。 */
:root {
  --sky-top: #3f8fd8;
  --sky-low: #cfe9f8;
  --ink: #ffffff;
  --ink-dim: rgba(255,255,255,.78);
  --glass: rgba(14, 32, 52, .42);
  --accent: #ffcc3d;     /* 金（一段葺き上がり） */
  --water: #5fc2ff;      /* 雨・バケツ */
  --danger: #ff5a4a;
  --storm: #2b3440;      /* 夕立の空 */
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: linear-gradient(180deg, var(--sky-top) 0%, #7dbbe9 45%, var(--sky-low) 100%);
  color: var(--ink); font-family: var(--body);
  -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
}
#dim { position: fixed; inset: 0; z-index: 0; background: linear-gradient(180deg, #1c232c 0%, var(--storm) 60%, #55606b 100%); opacity: 0; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 1; }
#bg, #px { position: fixed; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
#bg { z-index: 0; }
#px { z-index: 2; }
.bubble {
  position: fixed; z-index: 3; pointer-events: none; transform: translate(-85%, -100%); white-space: nowrap;
  font-family: "DotGothic16", var(--body); font-size: 13px; line-height: 1.2; color: #1d1a16; background: #fffaf0; padding: 5px 7px;
  box-shadow: 0 -3px 0 #1d1a16, 0 3px 0 #1d1a16, -3px 0 0 #1d1a16, 3px 0 0 #1d1a16, 3px 6px 0 rgba(0,0,0,.25);
}
.bubble::after { content: ""; position: absolute; right: 12%; bottom: -9px; width: 6px; height: 6px; background: #fffaf0; box-shadow: 3px 3px 0 #1d1a16, -3px 0 0 #1d1a16, 3px 0 0 #1d1a16; }
.bubble[hidden] { display: none; }
#flash { position: fixed; inset: 0; z-index: 2; background: #eef6ff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; }
#flash.on { opacity: .75; transition: none; }
canvas { display: block; touch-action: none; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
}
.hud .next { justify-self: end; }
.mute {
  pointer-events: auto; justify-self: start; width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
  background: var(--glass); color: var(--ink); font-size: 1rem; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.mute:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pill { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 12px; padding: 6px 10px; }
.hud > .pill:not(.next) { display: grid; grid-template-areas: "s m" "u m"; gap: 0 10px; align-items: center; }
.hud .score { grid-area: s; } .hud .sub { grid-area: u; } .hud .meters { grid-area: m; }
.score { font-family: var(--display); font-size: 1.25rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.sub { font-size: .64rem; color: var(--ink-dim); margin-top: 3px; display: flex; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meters { display: grid; grid-template-columns: auto 52px; gap: 4px 5px; align-items: center; font-size: .62rem; font-weight: 700; }
.bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: #e8eef4; }
.bar.cloud.warn i { background: var(--danger); animation: blink .5s steps(2) infinite; }
.bar.water i { background: var(--water); }
@keyframes blink { 50% { opacity: .45; } }
.next { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }
.next .lab { font-size: .6rem; letter-spacing: .14em; color: var(--ink-dim); }
.next .nm { font-size: .64rem; font-weight: 700; }
#nextGrid { display: grid; gap: 2px; }
#nextGrid i { width: 8px; height: 8px; border-radius: 2px; display: block; }

.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; justify-content: center; gap: 14px;
}
.controls button {
  width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
  background: var(--glass); color: var(--ink); font-size: 1.5rem; font-family: var(--body); font-weight: 700;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.controls button small { font-size: .6rem; margin-top: 3px; letter-spacing: .05em; }
.controls button:active { transform: scale(.93); background: rgba(14,32,52,.6); }
.controls button:focus-visible, .card button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.pop {
  position: fixed; left: 50%; top: 38%; z-index: 4; pointer-events: none; text-align: center;
  transform: translate(-50%, -50%); white-space: nowrap; opacity: 0;
}
.pop .big {
  font-family: var(--display); font-size: clamp(2.4rem, 13vw, 4.6rem); color: var(--accent);
  -webkit-text-stroke: 2px #6b3d00; text-shadow: 0 4px 0 #6b3d00, 0 10px 24px rgba(0,0,0,.35);
}
.pop.rain .big { color: var(--water); -webkit-text-stroke-color: #0d3b66; text-shadow: 0 4px 0 #0d3b66, 0 10px 24px rgba(0,0,0,.35); }
.pop .small { font-weight: 700; font-size: 1rem; text-shadow: 0 2px 6px rgba(0,0,0,.5); margin-top: 6px; }
.pop.show { animation: pop 1.3s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  25% { transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -75%) scale(1); }
}

.overlay { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 25, 40, .35); }
.card {
  background: rgba(255,255,255,.95); color: #1d2a36; border-radius: 22px; padding: 24px 22px 20px; max-width: 340px; width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; display: flex; flex-direction: column; gap: 12px;
}
.card h1, .card h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
.card h1 { font-size: 2.3rem; }
.card h1 span { display: block; font-size: 1rem; color: #3f8fd8; letter-spacing: .3em; margin-top: 6px; }
.card h2 { font-size: 1.8rem; }
.card p { margin: 0; line-height: 1.65; font-size: .9rem; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; font-size: .86rem; background: #eef4f9; border-radius: 12px; padding: 12px 14px; }
.howto b { font-family: var(--display); font-weight: 400; color: #3f8fd8; }
.howto .rain { color: #1f7fc4; }
.card .go {
  font-family: var(--display); font-size: 1.3rem; border: none; border-radius: 999px; padding: 14px 20px; cursor: pointer;
  background: #ff8a1f; color: #fff; box-shadow: 0 5px 0 #b85a00;
}
.card .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #b85a00; }
.best { font-size: .82rem; color: #5b6b78; }
.result { font-family: var(--display); font-size: 2.4rem; color: #ff8a1f; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .pop.show { animation-duration: .01s; } .bar.cloud.warn i { animation: none; } }
</style>
</head>
<body>


<canvas id="bg" aria-hidden="true"></canvas>
<div id="dim"></div>
<div id="stage"></div>
<canvas id="px" aria-hidden="true"></canvas>
<div class="bubble" id="bubble" hidden></div>
<div id="flash"></div>

<div class="hud">
  <button class="mute" id="mute" type="button" aria-label="音を消す">♪</button>
  <div class="pill">
    <div class="score" id="score">0</div>
    <div class="sub"><span id="lv">レベル 1</span><span id="lines">0段</span><span id="area">0.0㎡</span></div>
    <div class="meters">
      <span id="cloudLab">雨雲</span><div class="bar cloud" id="cloudBox"><i id="cloudBar"></i></div>
      <span>バケツ</span><div class="bar water"><i id="bucketBar"></i></div>
    </div>
  </div>
  <div class="pill next">
    <div class="lab">つぎ</div>
    <div id="nextGrid"></div>
    <div class="nm" id="nextName"></div>
  </div>
</div>

<div class="controls">
  <button id="bL" type="button" aria-label="左へ">◀</button>
  <button id="bRot" type="button" aria-label="回転">⟳<small>回転</small></button>
  <button id="bDrop" type="button" aria-label="一気に落とす">⤓<small>落とす</small></button>
  <button id="bR" type="button" aria-label="右へ">▶</button>
</div>

<div class="pop" id="pop"><div class="big" id="popBig"></div><div class="small" id="popSmall"></div></div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ===== 盤面 =====
  const COLS = 8, ROWS = 14, H = ROWS + 4;
  const PITCH = Math.atan(5 / 10);                 // 5寸勾配 ≒ 26.6°
  const TILES_PER_M2 = 16;                         // J形53A 桟瓦の葺き枚数（枚/㎡）
  const GROUND = -4.1;
  const BASE_Z = .06;
  const LIFT = .1;                                 // 頭が下の段の尻に乗って持ち上がる量
  const TL_ROW = 305 / 235 - 1;                    // 瓦の尻が上の段の下にもぐる長さ                              // 瓦桟の高さ（瓦の尻が掛かる）
  const RAIN_SEC = 8;                              // 夕立の長さ
  const BUCKET_PER_HOLE = 3.5;                     // 穴1か所・1秒あたりのバケツ増加（%）。穴が増えるほど1か所あたりは鈍る（√）
  const BUCKET_DUMP = 20;                          // 雨漏りゼロで凌いだら、職人がバケツをこれだけ捨てる（%）
  // 釉薬瓦の色見本（cc = ガラス質のツヤ）
  const GLAZE = {
    ichi: { name: "黄", color: 0xd29a1c, metal: .05, rough: .3, cc: .9 },
    ni: { name: "青", color: 0x23379a, metal: .15, rough: .25, cc: 1 },
    san: { name: "銀黒", color: 0x30363d, metal: .4, rough: .22, cc: 1 },
    kane: { name: "緑", color: 0x1f5a3c, metal: .1, rough: .25, cc: 1 },
    taba: { name: "いぶし銀", color: 0x8a9198, metal: .85, rough: .48, cc: 0 },
    okane: { name: "ブラウン", color: 0x4e3328, metal: .2, rough: .28, cc: .9 },
    toi: { name: "ワインレッド", color: 0x7a1a26, metal: .1, rough: .25, cc: 1 },
  };
  // 荷揚げする瓦のひと揚げ分。1枚から5枚まで、どれも3マス四方に収まる
  const PIECES = {
    ichi: { name: "一枚", rows: ["#"], w: 5 },
    ni: { name: "二枚", rows: ["##"], w: 10 },
    san: { name: "三枚", rows: ["###"], w: 14 },
    kane: { name: "曲尺", rows: ["#.", "##"], w: 16 },
    taba: { name: "束", rows: ["##", "##", "#."], w: 18 },
    okane: { name: "大曲尺", rows: ["#..", "#..", "###"], w: 18 },
    toi: { name: "樋", rows: ["#.#", "###"], w: 18 },
  };
  const ROT = {}, BOX = {};
  for (const k in PIECES) {
    const g = PIECES[k].rows, n = Math.max(g.length, ...g.map(r => r.length));
    let cells = [];
    g.forEach((row, yt) => [...row].forEach((ch, x) => { if (ch === "#") cells.push([x, n - 1 - yt]); }));
    ROT[k] = []; BOX[k] = n;
    for (let i = 0; i < 4; i++) { ROT[k].push(cells); cells = cells.map(([x, y]) => [y, n - 1 - x]); }
  }
  const LINES = {
    1: ["一段！", "ええ通りや"], 2: ["二段！", "ええ手つきや"], 3: ["三段！！！", "いっぺんに三段、たいしたもんや"],
  };
  // 現場：10段葺き上げたら次の現場へ。屋根の形で置ける所が変わる
  const COS_P = Math.cos(PITCH), SIN_P = Math.sin(PITCH);
  // 下屋は [中心, 半幅]。谷は平面で45°なので、半幅 w の下屋は高さ w/cos まで本屋根に食い込む
  const HIP_IN = 2, HIP_STEP = 1 / COS_P, HIP_TOP = HIP_IN * HIP_STEP;   // 入母屋：隅棟が平面45°で2枚ぶん内へ入る
  const SITES = [
    { key: "kiri", name: "切妻", note: "まずは素直な切妻。端は袖瓦で納める。" },
    { key: "tani", name: "谷", wings: [[0, 3]], note: "正面に下屋が取り付く。軒の真ん中は下屋の屋根でふさがって、谷に沿って段々になる。" },
    { key: "iri", name: "入母屋", note: "お寺らしい入母屋。軒は8枚、隅棟に沿って6枚、上は妻の内側の4枚。狭い所から落として、軒先へ横に滑り込ませるのがコツ。" },
    { key: "L", name: "L字", wings: [[-2, 2]], note: "左に下屋が取り付いたL字の家。谷は右の一本だけ。左の軒はずっと上まで食い込む。" },
    { key: "futa", name: "二つ谷", wings: [[-2.5, 1.5], [1.5, 1.5]], note: "下屋が二つ並んで谷が四本。軒先に開いているのは二か所だけ。" },
  ];
  const wingsOf = key => (SITES.find(t => t.key === key) || {}).wings || [];
  const SITE_LINES = 10;
  function makeMask(key) {
    return Array.from({ length: H }, (_, r) => Array.from({ length: COLS }, (_, c) => {
      if (r >= ROWS) return true;
      const x = c - (COLS - 1) / 2, y = r + .5;
      if (wingsOf(key).some(([cx, w]) => Math.abs(x - cx) < w - y * COS_P)) return false;
      if (key === "iri") return Math.abs(x) < COLS / 2 - Math.min(HIP_IN, Math.floor(y / HIP_STEP));
      return true;
    }));
  }

  // ===== three.js =====
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, .1, 200);

  // 空の映り込み（釉薬のツヤに空と地面が映る）
  {
    const env = new THREE.Scene();
    const geo = new THREE.SphereGeometry(10, 32, 16), col = [];
    const top = new THREE.Color(0x3f8fd8), hor = new THREE.Color(0xe6f3ff), gnd = new THREE.Color(0x5a4c36), c = new THREE.Color();
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 10;
      if (y > 0) c.copy(hor).lerp(top, Math.pow(y, .6)); else c.copy(hor).lerp(gnd, Math.min(1, -y * 4));
      col.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    env.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const sunDisk = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    sunDisk.position.set(-5, 7, 5); env.add(sunDisk);
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, .02).texture;
  }

  const hemi = new THREE.HemisphereLight(0xdff1ff, 0x6b5a3a, .45);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.25);
  sun.position.set(-8, 18, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 14, bottom: -8, near: 1, far: 50 });
  sun.shadow.bias = -.0008;
  scene.add(sun);

  // 屋根面（ローカル: x=列, y=軒→棟, z=屋根の法線）
  const roof = new THREE.Group();
  roof.rotation.x = PITCH - Math.PI / 2;
  scene.add(roof);
  const cellX = c => c - (COLS - 1) / 2;
  const cellY = r => r + .5;
  const DOWN_SLOPE = new THREE.Vector3(0, -Math.sin(PITCH), Math.cos(PITCH));   // 軒へ向かう向き（ワールド）

  // 野地のルーフィング（防水シート）。瓦桟や破風・棟は現場ごとに buildSite で作る
  const deckTex = (() => {
    const cv = document.createElement("canvas"); cv.width = 256; cv.height = 448;
    const g = cv.getContext("2d");
    g.fillStyle = "#3a3f3c"; g.fillRect(0, 0, 256, 448);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "255,255,255" : "0,0,0"},${Math.random() * .06})`; g.fillRect(Math.random() * 256, Math.random() * 448, 2, 2); }
    for (let y = 448 - 150; y > 0; y -= 150) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, y, 256, 3); g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0, y + 3, 256, 1); }   // シートの重ね
    g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1;
    for (let y = 448 - 75; y > 0; y -= 150) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); }   // 印刷の目安線
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
    return tex;
  })();
  const deckMat = new THREE.MeshStandardMaterial({ map: deckTex, roughness: .9, envMapIntensity: .3 });
  const battenMat = new THREE.MeshStandardMaterial({ color: 0xc89a64, roughness: .85, envMapIntensity: .3 });
  const bargeMat = new THREE.MeshStandardMaterial({ color: 0x3b2a1c, roughness: .8, envMapIntensity: .3 });
  const ridgeMat = new THREE.MeshStandardMaterial({ color: 0x7f878f, metalness: .85, roughness: .42, emissive: 0x000000 });
  const oniMat = new THREE.MeshStandardMaterial({ color: 0x4a5058, metalness: .85, roughness: .45 });
  // 下屋や入母屋の隅の屋根面：いぶし瓦の葺き目を描いた板（u＝流れと直角、v＝流れ方向、1＝瓦1枚）
  const sideTileMat = (() => {
    const cv = document.createElement("canvas"); cv.width = 64; cv.height = 64;
    const g = cv.getContext("2d");

      box(b - a, .16, .35, bargeMat, (a + b) / 2, -.08, -.05, siteRoof, false);
      box(Math.min(b, half) - Math.max(a, -half), .1, BASE_Z + LIFT, battenMat, (Math.max(a, -half) + Math.min(b, half)) / 2, .12, (BASE_Z + LIFT) / 2, siteRoof, false);
      const len = b - a + .32, g = new THREE.ExtrudeGeometry(gutterShape, { depth: len, bevelEnabled: false, curveSegments: 12 });
      g.rotateY(Math.PI / 2); g.translate(-len / 2, 0, 0);
      const gut = new THREE.Mesh(g, copperMat); gut.position.copy(gutterC); gut.position.x += (a + b) / 2; gut.castShadow = true; siteWorld.add(gut);
      const lip = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, len, 8), copperMat);       // 耳（縁の巻き）
      lip.rotation.z = Math.PI / 2; lip.position.copy(gut.position).add(new THREE.Vector3(0, 0, .17)); siteWorld.add(lip);
    }
    // 大棟（のし積み＋冠瓦）と鬼瓦
    for (let i = 0; i < 3; i++) box(topHalf * 2 + .2, .5, .16, ridgeMat, 0, ROWS + .1, .14 + i * .17, siteRoof);
    beam(new THREE.Vector3(-topHalf - .15, ROWS + .1, .67), new THREE.Vector3(topHalf + .15, ROWS + .1, .67), .3, ridgeMat, siteRoof);
    [-1, 1].forEach(s => {
      box(.5, .9, 1.3, oniMat, s * (topHalf + .3), ROWS + .05, .57, siteRoof);
      const horn = new THREE.Mesh(new THREE.ConeGeometry(.16, .5, 10), oniMat);
      horn.position.set(s * (topHalf + .3), ROWS + .05, 1.42); horn.rotation.x = Math.PI / 2; siteRoof.add(horn);
    });
    if (iri) {
      // 入母屋：軒の隅から隅棟が平面45°で妻の足元へ上がり、外側には奥へ流れる隅の屋根面
      const depth = (ROWS - HIP_TOP) * COS_P, run = half - topHalf;
      [-1, 1].forEach(s => {
        const P0 = new THREE.Vector3(s * half, 0, 0), P1 = new THREE.Vector3(s * topHalf, HIP_TOP, 0);
        const B = P1.clone().addScaledVector(UP_BACK, depth), QB = P0.clone().addScaledVector(UP_BACK, run + depth);
        siteRoof.add(quadMesh([P0, P1, B, QB], [[0, 0], [run, HIP_TOP], [run + depth, HIP_TOP], [run + depth, 0]], sideTileMat));
        beam(P0.clone().setZ(.24), P1.clone().setZ(.24), .17, oniMat, siteRoof);              // 隅棟
        beam(P1.clone().setZ(.2), B.clone().add(new THREE.Vector3(0, 0, .2)), .1, oniMat, siteRoof);       // 妻の足元の水切り
        box(.36, .5, .5, oniMat, s * (half + .05), -.05, .35, siteRoof);                // 隅鬼
        box(.06, ROWS - HIP_TOP + .2, .9, plasterMat, s * (topHalf - .02), (ROWS + HIP_TOP) / 2, -.55, siteRoof, false);   // 妻の白壁（破風の下）
      });
    }
    // 下屋：本屋根の正面に切妻の下屋が取り付き、谷（銅板）で納まる
    const wallMat = wings.length ? new THREE.MeshStandardMaterial({ map: templeTex(), roughness: .9, envMapIntensity: .4 }) : null;
    for (const [cx, w] of wings) {
      const LF = 1.6, hr = w * Math.tan(PITCH), top = w / COS_P;
      const M = new THREE.Vector3(cx, top, 0), F = M.clone().addScaledVector(FWD, w + LF);
      [-1, 1].forEach(s => {
        const A = new THREE.Vector3(cx + s * w, 0, 0), Ef = A.clone().addScaledVector(FWD, LF);
        const face = quadMesh([A, M, F, Ef], [[0, 0], [-w, top], [LF, top], [LF, 0]], sideTileMat);
        face.position.z += .02; siteRoof.add(face);
        const v = M.clone().sub(A), len = v.length();
        const valley = new THREE.Mesh(new THREE.BoxGeometry(.32, len, .02), copperMat);   // 谷板
        valley.position.copy(A).add(M).multiplyScalar(.5).setZ(.03);
        valley.rotation.z = Math.atan2(v.y, v.x) - Math.PI / 2; siteRoof.add(valley);
        beam(A.clone().addScaledVector(FWD, LF).add(new THREE.Vector3(0, 0, .06)), F.clone().add(new THREE.Vector3(0, 0, .06)), .05, bargeMat, siteRoof);   // 破風
      });
      beam(M.clone().setZ(.12), F.clone().add(new THREE.Vector3(0, 0, .12)), .17, ridgeMat, siteRoof);   // 下屋の棟
      const oni = box(.4, .6, .5, oniMat, 0, 0, 0, siteRoof); oni.position.copy(F).add(new THREE.Vector3(0, -.1, .3));
      // 下屋の壁と、正面の妻壁（ワールド座標）
      const wingFront = LF - .35;
      const walls = new THREE.Mesh(new THREE.BoxGeometry(w * 2 - .6, -GROUND, wingFront + .8), wallMat);
      walls.position.set(cx, GROUND / 2, (wingFront - .8) / 2); walls.receiveShadow = true; siteWorld.add(walls);
      const gab = new THREE.Shape([new THREE.Vector2(-w + .3, 0), new THREE.Vector2(w - .3, 0), new THREE.Vector2(0, hr - .25)]);
      const gm = new THREE.Mesh(new THREE.ShapeGeometry(gab), plasterMat); gm.position.set(cx, 0, wingFront); siteWorld.add(gm);
    }
  }

  // 同じ色でも焼きムラで1枚ずつ少し違う（色ごとに3通り）
  const MATS = {}, GHOST = {};
  for (const k in GLAZE) {
    const G = GLAZE[k];
    MATS[k] = [0, 1, 2].map(i => {
      const col = new THREE.Color(G.color).offsetHSL(0, (i - 1) * .03, (i - 1) * .02).convertSRGBToLinear();   // 色見本どおりの濃さで出す
      const m = new THREE.MeshPhysicalMaterial({ color: col, metalness: G.metal, roughness: G.rough + (i - 1) * .04, clearcoat: G.cc, clearcoatRoughness: .1, envMapIntensity: .6 });
      m.userData.rough = m.roughness;
      return m;
    });
    GHOST[k] = new THREE.MeshBasicMaterial({ color: new THREE.Color(G.color).convertSRGBToLinear(), transparent: true, opacity: .28, depthWrite: false });
  }

  function makeTile(kind, ghost) {
    const m = new THREE.Mesh(tileGeo, ghost ? GHOST[kind] : MATS[kind][Math.floor(Math.random() * 3)]);
    if (!ghost) {
      m.castShadow = true; m.receiveShadow = true;
      const n = new THREE.Mesh(nailGeo, nailMat); m.add(n);
    }
    m.userData.kind = kind;
    return m;
  }
  function place(mesh, c, r, snap) {
    mesh.userData.tx = cellX(c); mesh.userData.ty = cellY(r);
    if (r >= 0 && r < ROWS) mesh.geometry = TILE_GEO[geoFor(c, r)];
    if (snap) mesh.position.set(cellX(c), cellY(r), BASE_Z);
  }

  // 雨漏りの印としずく
  const leakMarks = [];
  for (let i = 0; i < 60; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(.86, .86), new THREE.MeshBasicMaterial({ color: 0x4fb3ff, transparent: true, opacity: 0, depthWrite: false }));
    m.visible = false; roof.add(m); leakMarks.push(m);
  }
  const dropMat = new THREE.MeshBasicMaterial({ color: 0x9fd8ff });
  const dropGeo = new THREE.SphereGeometry(.06, 8, 6);
  const drops = [];

  // ===== ゲーム状態 =====
  let board, piece, ghost, lastKinds = [], nextKind, score = 0, lines = 0, level = 1, state = "title";
  let site = 0, siteKey = "kiri", siteLines = 0, mask = makeMask("kiri");
  let soft = false;
  let fallAcc = 0, lockAcc = 0, lockResets = 0, shake = 0, danger = 0;
  let cloud = 0, raining = false, rainT = 0, rainAmt = 0, bucket = 0, bucketAtRain = 0, flashT = 0;
  const sliding = [], flying = [];
  let best = 0;
  try { best = +localStorage.getItem("kawara3d-best") || 0; } catch (e) {}

  // 重みつきで選ぶ。同じ束が3回続かないようにする
  function draw() {
    const ks = Object.keys(PIECES).filter(k => !(lastKinds[0] === k && lastKinds[1] === k));
    let r = Math.random() * ks.reduce((a, k) => a + PIECES[k].w, 0), k = ks[0];
    for (const c of ks) { r -= PIECES[c].w; if (r < 0) { k = c; break; } }
    lastKinds = [k, lastKinds[0]];
    return k;
  }

  function reset() {
    if (board) board.forEach(row => row.forEach(m => m && roof.remove(m)));
    if (piece) piece.meshes.forEach(m => roof.remove(m));
    if (ghost) ghost.forEach(m => roof.remove(m));
    board = Array.from({ length: H }, () => Array(COLS).fill(null));
    score = 0; lines = 0; level = 1; lastKinds = []; nextKind = draw();
    if (site !== 0) goSite(0);
    siteLines = 0;
    piece = null; ghost = null;
    cloud = 0; raining = false; rainT = 0; bucket = 0;
    hud();
  }
  const speed = () => Math.max(70, 800 * Math.pow(.84, level - 1));
  const cloudRate = () => 100 / Math.max(14, 28 - 2 * (level - 1));   // 雨雲ゲージ（%/秒）
  const cellsOf = (k, rot, px, py) => ROT[k][rot].map(([x, y]) => [px + x, py + y]);
  const fits = cells => cells.every(([x, y]) => x >= 0 && x < COLS && y >= 0 && y < H && mask[y][x] && !board[y][x]);

  // 上に瓦があるのに下が空いている所＝雨漏りする穴
  function holes() {
    const out = [];
    for (let x = 0; x < COLS; x++) {
      let top = -1;
      for (let y = ROWS - 1; y >= 0; y--) if (board[y][x]) { top = y; break; }
      for (let y = 0; y < top; y++) if (!board[y][x] && mask[y][x]) out.push([x, y]);
    }
    return out;
  }

  function spawn() {
    const kind = nextKind; nextKind = draw();
    const n = BOX[kind], cnt = ROT[kind][0].length;
    const px = Math.floor((COLS - n) / 2), py = ROWS;
    if (!fits(cellsOf(kind, 0, px, py))) return gameOver("top");
    const meshes = Array.from({ length: cnt }, () => { const m = makeTile(kind); roof.add(m); return m; });
    piece = { kind, rot: 0, px, py, meshes };
    if (ghost) ghost.forEach(m => roof.remove(m));
    ghost = Array.from({ length: cnt }, () => { const m = makeTile(kind, true); roof.add(m); return m; });
    syncPiece(true);
    pixelEvent("spawn");
    fallAcc = 0; lockAcc = 0; lockResets = 0;
    hud();
  }
  function syncPiece(snap) {
    const cells = cellsOf(piece.kind, piece.rot, piece.px, piece.py);
    cells.forEach(([x, y], i) => place(piece.meshes[i], x, y, snap));
    let d = 0; while (fits(cellsOf(piece.kind, piece.rot, piece.px, piece.py - d - 1))) d++;
    cells.forEach(([x, y], i) => { ghost[i].position.set(cellX(x), cellY(y - d), BASE_Z); if (y - d >= 0) ghost[i].geometry = TILE_GEO[geoFor(x, y - d)]; ghost[i].visible = d > 0; });
  }
  function tryMove(dx, dy) {
    if (state !== "play" || !piece) return false;
    const c = cellsOf(piece.kind, piece.rot, piece.px + dx, piece.py + dy);
    if (!fits(c)) return false;
    piece.px += dx; piece.py += dy;
    if (dx && lockResets < 15) { lockAcc = 0; lockResets++; }
    syncPiece(); if (dx) sfx("move");
    return true;
  }
  function rotate(dir = 1) {
    if (state !== "play" || !piece) return;
    const nr = (piece.rot + (dir > 0 ? 1 : 3)) % 4;
    for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [0, 1], [-2, 0], [2, 0], [0, -1]]) {
      if (fits(cellsOf(piece.kind, nr, piece.px + kx, piece.py + ky))) {
        piece.rot = nr; piece.px += kx; piece.py += ky;
        if (lockResets < 15) { lockAcc = 0; lockResets++; }
        syncPiece(); sfx("rot"); return;
      }
    }
  }
  function hardDrop() {
    if (state !== "play" || !piece) return;
    let d = 0; while (tryMove(0, -1)) d++;
    score += d * 2; shake = Math.min(.35, .12 + d * .015);
    lock();
  }
  function lock() {
    const cells = cellsOf(piece.kind, piece.rot, piece.px, piece.py);
    cells.forEach(([x, y], i) => { board[y][x] = piece.meshes[i]; });
    ghost.forEach(m => roof.remove(m)); ghost = null;
    piece = null;
    sfx("lock");
    if (cells.some(([, y]) => y >= ROWS)) return gameOver("top");
    const full = [];
    for (let y = 0; y < ROWS; y++) if (mask[y].some(Boolean) && board[y].every((m, x) => m || !mask[y][x])) full.push(y);
    if (full.length) {
      full.forEach(y => board[y].forEach((m, x) => m && slide(m, x * 25 + Math.random() * 40)));
      // 列ごとに、置ける升だけを詰めて下ろす（谷や妻でふさがった升は飛ばす）
      for (let x = 0; x < COLS; x++) {
        const slots = []; for (let y = 0; y < H; y++) if (mask[y][x]) slots.push(y);
        const keep = slots.filter(y => !full.includes(y)).map(y => board[y][x]);
        slots.forEach((y, i) => { board[y][x] = keep[i] || null; });
      }
      board.forEach((row, y) => row.forEach((m, x) => m && place(m, x, y)));
      lines += full.length; siteLines += full.length;
      score += [0, 100, 300, 600][full.length] * level;
      level = 1 + Math.floor(lines / 6);
      if (!raining) cloud = Math.max(0, cloud - 10 * full.length);   // 葺くほど雨雲が遠のく
      const [big, small] = LINES[full.length];
      showPop(big, small);
      sfx("clear" + full.length);
      shake = .25 + full.length * .08;
      pixelEvent("clear", full.length);
      if (siteLines >= SITE_LINES) { hud(); return siteDone(); }
    }
    hud();
    spawn();
  }

  // 瓦が屋根を滑り落ちて、軒から落ち、地面で割れる
  function slide(m, delay = 0) {
    m.userData.tx = undefined;
    m.userData.vs = 0; m.userData.delay = delay / 1000; m.userData.vx = (Math.random() - .5) * .8;
    m.userData.spin = (Math.random() - .5) * 2;
    sliding.push(m);
  }
  function toWorld(m, v) {
    m.updateMatrixWorld();
    const p = new THREE.Vector3(), q = new THREE.Quaternion();
    m.getWorldPosition(p); m.getWorldQuaternion(q);
    roof.remove(m); scene.add(m);
    m.position.copy(p); m.quaternion.copy(q);
    m.userData.v = v;
    m.userData.w = new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 6 - 3, Math.random() * 8 - 4);
    m.userData.life = 0; m.userData.bounces = 0;
    flying.push(m);
  }
  let shardCount = 0, lastClack = 0;
  function shatter(m) {
    const p = m.position.clone(), mat = m.material;
    scene.remove(m);
    const n = shardCount > 160 ? 0 : 3 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      const s = new THREE.Mesh(shardGeos[Math.floor(Math.random() * shardGeos.length)], mat);
      s.scale.setScalar(.7 + Math.random() * .4);
      s.castShadow = true;
      s.position.copy(p).add(new THREE.Vector3((Math.random() - .5) * .4, .1, (Math.random() - .5) * .4));
      s.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      s.userData = { v: new THREE.Vector3((Math.random() - .5) * 5, 2 + Math.random() * 3, (Math.random() - .2) * 4), w: new THREE.Vector3(Math.random() * 14 - 7, Math.random() * 14 - 7, Math.random() * 14 - 7), life: 0, bounces: 1, shard: true };
      scene.add(s); flying.push(s); shardCount++;
    }
    const now = performance.now();
    if (now - lastClack > 35) { lastClack = now; sfx("break"); }
  }

  function goSite(i) {
    site = i; siteKey = SITES[i].key; mask = makeMask(siteKey); siteLines = 0;
    if (board) board.forEach(row => row.forEach(m => m && roof.remove(m)));
    board = Array.from({ length: H }, () => Array(COLS).fill(null));
    buildSite(siteKey);
    if (AW) sizePixel();
  }
  function siteDone() {
    state = "done"; raining = false;
    const bonus = 2000 * level, done = SITES[site], nx = (site + 1) % SITES.length, N = SITES[nx];
    score += bonus; hud();
    track("site_clear", { site: done.name, score, lines, level });
    showPop("葺き上がり！", `${done.name}の屋根、完成や　+${bonus.toLocaleString()}`);
    sfx("kane"); pixelEvent("site");
    setTimeout(() => card(`
      <h2>${done.name}、葺き上がり</h2>
      <p>ここまで ${lines}段・${(lines * COLS / TILES_PER_M2).toFixed(1)}㎡</p>
      <p class="best">次の現場：${N.name}</p>
      <p>${N.note}</p>
      <button class="go" id="go" type="button">次の現場へ</button>`, () => { goSite(nx); cloud = 0; bucket = 0; state = "play"; spawn(); }), 1800);
  }
  function startRain() {
    raining = true; rainT = RAIN_SEC; bucketAtRain = bucket;
    showPop("夕立や！", holes().length ? "隙間から漏るで！" : "隙間なし、どんと来い", true);
    sfx("thunder"); flashT = .01; leakSaid = false;
    pixelEvent("rain");
  }
  function endRain() {
    raining = false; cloud = 0;
    const gained = bucket - bucketAtRain;
    track("rain_end", { site: SITES[site].name, leak_pct: Math.round(gained), bucket: Math.round(bucket) });
    if (gained < .5) {
      const dump = Math.min(bucket, BUCKET_DUMP); bucket -= dump;
      pixelEvent("dry"); sfx("rin"); score += 500 * level; sfx("clear3");
      showPop("雨漏りゼロ！", `ええ屋根や　+${(500 * level).toLocaleString()}` + (dump >= 1 ? `　バケツ −${Math.round(dump)}%` : ""));
    }
    else showPop("雨上がり", `バケツ +${Math.round(gained)}%　隙間を埋めときや`, true);
    hud();
  }

  function gameOver(reason) {
    state = "over"; raining = false;
    track("game_over", { reason: reason === "water" ? "バケツ" : "棟まで", site: SITES[site].name, score, lines, level });
    if (piece) { piece.meshes.forEach((m, i) => slide(m, i * 30)); piece = null; }
    if (ghost) { ghost.forEach(m => roof.remove(m)); ghost = null; }
    let k = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < COLS; x++) {
      const m = board[y][x]; if (!m) continue;
      board[y][x] = null; slide(m, y * 60 + Math.random() * 120 + (k++ % 3) * 10);
    }
    sfx("over"); shake = .5;
    pixelEvent("over", reason);
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem("kawara3d-best", best); } catch (e) {} }
    const head = reason === "water" ? "バケツがあふれた！" : "棟まで乱れた！";
    const note = reason === "water" ? "施主さんカンカンや…隙間は雨漏りのもとやで。" : "積み上がりすぎや。";
    setTimeout(() => card(`
      <h2>${head}</h2>
      <p>${note}</p>
      <div class="result">${score.toLocaleString()}</div>
      <p>${lines}段葺き上げ・${(lines * COLS / TILES_PER_M2).toFixed(1)}㎡</p>
      <p class="best">${isBest ? "自己ベスト更新や！" : "自己ベスト " + best.toLocaleString()}</p>
      <button class="go" id="go" type="button">もう一回葺く</button>`, start), 1400);
  }

  // ===== 画面まわり =====
  const $ = id => document.getElementById(id);
  function hud() {
    $("score").textContent = score.toLocaleString();
    $("lv").textContent = SITES[site].name + " " + Math.min(siteLines, SITE_LINES) + "/" + SITE_LINES + "段";
    $("lines").textContent = "Lv" + level;
    $("area").textContent = (lines * COLS / TILES_PER_M2).toFixed(1) + "㎡";
    const k = nextKind, rows = PIECES[k].rows, n = Math.max(...rows.map(r => r.length)), hex = "#" + GLAZE[k].color.toString(16).padStart(6, "0");
    const grid = $("nextGrid");
    grid.style.gridTemplateColumns = `repeat(${n}, 8px)`;
    grid.innerHTML = rows.map(r => [...r.padEnd(n, ".")].map(ch => `<i style="background:${ch === "#" ? hex : "transparent"}"></i>`).join("")).join("");
    $("nextName").textContent = PIECES[k].name;
  }
  function meters() {
    const cv = raining ? rainT / RAIN_SEC * 100 : cloud;
    $("cloudBar").style.width = cv + "%";
    $("cloudLab").textContent = raining ? "夕立中" : "雨雲";
    $("cloudBox").classList.toggle("warn", !raining && cloud > 75);
    $("bucketBar").style.width = Math.min(100, bucket) + "%";
  }
  function showPop(big, small, rain) {
    const p = $("pop"); $("popBig").textContent = big; $("popSmall").textContent = small;
    p.classList.toggle("rain", !!rain);
    p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
  }
  function card(html, onGo) {
    $("card").innerHTML = html; $("overlay").hidden = false;
    $("go").onclick = () => { $("overlay").hidden = true; onGo(); };
    $("go").focus();
  }
  // アクセス解析：GitHub Pages 版だけ window.track が入る（Claude 版では何もしない）
  const track = (name, params) => { try { if (window.track) window.track(name, params); } catch (e) {} };
  function start() {
    unlockAudio(); track("game_start", { site: SITES[0].name });
    reset(); state = "play"; spawn();
  }

  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h;
    const center = new THREE.Vector3(0, ROWS / 2 * Math.sin(PITCH), -ROWS / 2 * Math.cos(PITCH));
    const phi = THREE.MathUtils.degToRad(42);
    const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const usable = (h - 290) / h;                       // 得点帯・棟の親方・ボタン・地上の若い衆を除いた割合
    const dH = (ROWS * Math.sin(PITCH + phi) / 2 + 1.1) / (vt * usable);
    const dW = (COLS / 2 + 2.6) / (vt * camera.aspect);            // 左右に足場と住職のぶんの余白
    const d = Math.max(dH, dW);

    <p>横一段そろえば葺き上がり、雨雲も遠のく。<br>棟まで積むか、バケツがあふれたら負けや。</p>
    ${best ? `<p class="best">自己ベスト ${best.toLocaleString()}</p>` : ""}
    <button class="go" id="go" type="button">葺きはじめる</button>`, start);
  setTimeout(() => pixelEvent("title"), 1200);
})();
</script>
